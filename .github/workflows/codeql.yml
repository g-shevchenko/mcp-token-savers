name: CodeQL

on:
  push:
    branches: ["main", "codex/**"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "24 3 * * 2"

permissions:
  contents: read
  security-events: write

# Opt JavaScript-based actions into Node 24 runtime ahead of the 2026-06-02
# forced switch. All actions used here are Node-24-compatible.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  analyze:
    name: CodeQL JavaScript/TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63
        with:
          languages: javascript-typescript
      - name: Autobuild
        uses: github/codeql-action/autobuild@b96794f015dfd88f77b49b1c93e0fa7110f94c63
      - name: Analyze
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63

